[package]
name = "fbyt-clone-vault"
version = "0.1.0"
description = "FBYT Clone Vault Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2" }
# Pinned to 2.0.0: 0.7.0 does not exist in the crates.io index (project would not resolve),
# and 0.6.1 caps bytemuck_derive at <=1.8.1, which anchor-spl 1.0.2's bytemuck 1.23+ cannot satisfy.
# 2.0.0 keeps the same price_update API and targets anchor-lang 1.0.2.
pyth-solana-receiver-sdk = "2.0.0"
solana-security-txt = "1.1.1"

[dev-dependencies]
serde = "1"
serde_json = "1"
litesvm = "=0.15.2"
borsh = "1.6.1"
spl-token = "7"
spl-associated-token-account = "6"
# Pinned to the exact versions litesvm 0.15.2 resolves, so the test crate's
# Transaction/Message/Instruction types are the same types LiteSVM::send_transaction accepts.
# These were previously pinned to nonexistent versions (e.g. 3.0.2) and the project never resolved.
solana-pubkey = "3"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-instruction = "3.4.0"
solana-system-interface = "3.2.0"
wincode = "=0.5.5"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
# anchor_lang's `#[derive(Accounts)]` / `#[program]` macros emit `cfg(feature = "cpi")`
# checks that new rustc `unexpected_cfgs` lint rejects. Anchor's own lint is
# `unexpected_cfgs` (check-cfg). Suppress it for this crate so a modern rustc
# (1.80+) can compile the program without the anchor macros being flagged.
unexpected_cfgs = "allow"
