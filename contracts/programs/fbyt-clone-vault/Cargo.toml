[package]
name = "fbyt-clone-vault"
version = "0.1.0"
description = "FBYT Clone Vault Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["idl-build"] }
pyth-solana-receiver-sdk = "0.7.0"

[dev-dependencies]
litesvm = { version = "0.15", features = ["anchor"] }
anchor-litesvm = "0.2"
litesvm-utils = "0.1"
borsh = "1.6.1"
spl-token = "7"
spl-associated-token-account = "6"
solana-pubkey = "3.0.2"
solana-keypair = "3.0.2"
solana-signer = "3.0.2"
solana-message = "3.0.2"
solana-transaction = "3.0.2"
solana-instruction = "3.0.2"
solana-system-interface = "3.0.2"

[profile.release]
opt-level = 3
overflow-checks = true
lto = "fat"
codegen-units = 1
