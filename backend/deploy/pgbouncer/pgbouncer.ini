; deploy/pgbouncer/pgbouncer.ini
; Transaction pooling for high-concurrency API traffic.
; The app connects to PgBouncer on 6432; PgBouncer multiplexes many client
; transactions over a small set of real connections to TimescaleDB on 5432.
; Read-path bursts must NOT exhaust Postgres max_connections — they queue
; here instead.

[databases]
fbyt = host=timescaledb port=5432 dbname=fbyt

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; Client auth. SCRAM (not md5): PG16 servers store SCRAM verifiers only,
; and md5 responses are rejected. Plaintext password in userlist.txt is
; used to derive the SCRAM verifier.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- pooling -------------------------------------------------------------
; Transaction pooling: a server connection is returned to the pool when the
; transaction ends, NOT when the client disconnects. This is what lets 1000
; API clients share ~20 DB connections.
pool_mode = transaction

; Max client connections PgBouncer accepts (before "too many connections").
max_client_conn = 1000
; Connections per (database, user) pair opened to the backend.
default_pool_size = 20
; Keep a small hot pool ready to absorb latency spikes.
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- prepared statements (pgx/GORM) -------------------------------------
; Since PgBouncer 1.17, named prepared statements survive transaction pooling
; (re-prepared on demand). GORM's pgx driver prepares statements — do not
; set this to 0 or queries will fail with "prepared statement ... does not
; exist". If you still hit statement errors, add
; ?default_query_exec_mode=simple_protocol to DATABASE_URL instead.
max_prepared_statements = 100

; Reset session state when a server connection returns to the pool.
server_reset_query = DISCARD ALL

; --- lifetime ------------------------------------------------------------
server_lifetime = 3600
server_idle_timeout = 600

; --- misc ----------------------------------------------------------------
; Clients may send these startup params without breaking pooling.
ignore_startup_parameters = extra_float_digits, options
tcp_keepalive = 1
tcp_keepidle = 300
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
syslog = 0
pidfile = /tmp/pgbouncer.pid
logfile = /tmp/pgbouncer.log
admin_users = postgres
