# deploy/redis/redis.conf — caching layer (consumed by agent 6+)
# Minimal production-sane config for cache-aside caching.

# Hard cap so the cache can never OOM the host.
maxmemory 256mb

# Cache-aside pattern: evict least-recently-used keys under pressure.
# Fine for cache-only usage; do NOT store durable data in Redis.
maxmemory-policy allkeys-lru

# Persist the write-ahead log so a restart doesn't cold-storm the DB.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
