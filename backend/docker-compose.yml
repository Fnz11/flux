# Flux backend infrastructure: TimescaleDB + PgBouncer + Redis
#
# Start everything:
#   docker compose up -d
#
# Topology:
#   app ──(DATABASE_URL, port 6432)──▶ pgbouncer ──▶ timescaledb (5432)
#   app ──(DIRECT_DATABASE_URL, 5432)────────────────▶ timescaledb   (migrations only)
#   app ──(REDIS_URL, 6379)──────────────────────────▶ redis
#
# Runtime API traffic goes THROUGH PgBouncer (transaction pooling).
# DDL/migrations go DIRECT to timescaledb:5432 — never through
# pgbouncer, because CREATE INDEX / CREATE MATERIALIZED VIEW / create_hypertable
# hold locks and long transactions that fight the pool.

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: flux-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flux}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flux}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: flux-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-flux}
      DB_HOST: timescaledb
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      SERVER_IDLE_TIMEOUT: 60
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-flux}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  timescaledb_data:
  redis_data:
